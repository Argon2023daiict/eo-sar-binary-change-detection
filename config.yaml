
data:
  train_dir: "/kaggle/input/datasets/rahuliiit1011/galaxeye-dataset/train/train"

  val_dir: "/kaggle/input/datasets/rahuliiit1011/galaxeye-dataset/val/val"

  test_dir: "/kaggle/input/datasets/rahuliiit1011/galaxeye-dataset/test/test"

  image_size: 224

  num_workers: 4


model:
  name: "changeformer"

  backbone: "swin_tiny"

  pretrained: true


training:
  seed: 42

  epochs: 50

  batch_size: 8

  learning_rate: 0.0001

  weight_decay: 0.0001

  early_stopping_patience: 10


loss:
  bce_weight: 0.5

  dice_weight: 0.5


checkpoint:
  save_dir: "checkpoints_changeformer"
